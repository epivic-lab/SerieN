name: SerieN 6B.2-A isolated PostgreSQL 17 security smoke
on:
  push:
    branches: [feature/train-persistence-auth]
    paths:
      - 'tests/db-security-6b2a.sql'
      - '.github/workflows/persistence-db-security-6b2a.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security-smoke:
    runs-on: ubuntu-24.04
    services:
      pg17:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only-ephemeral
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout exact branch tree
        uses: actions/checkout@v4
      - name: Execute synthetic security checks inside ephemeral PostgreSQL (no remote DB)
        env:
          DB_CONTAINER: ${{ job.services.pg17.id }}
        run: |
          test -n "$DB_CONTAINER"
          docker exec -i "$DB_CONTAINER" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 < tests/db-security-6b2a.sql
